name: release

# Publish the merged double-precision editor + export templates as GitHub
# release assets, so downstream packaging (fabric-godot-packaging:
# release-apk.yml / release-msix.yml, and the loop-slice Linux export in
# stage.sh) can `gh release download "$TAG" -p '<asset>'` them.
#
# build.yml only pushes GHCR images + ephemeral CI artifacts — nothing
# durable to download. This workflow rebuilds from source (same `just`
# recipes) and attaches the binaries under names the consumers expect:
#   godot.linuxbsd.editor.double.x86_64
#   godot.linuxbsd.template_release.double.x86_64   (+ template_debug)
#   godot.windows.editor.double.x86_64.exe
#   godot.windows.template_release.double.x86_64.exe (+ template_debug)
#   android_release.apk / android_debug.apk          (best-effort)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. 2026.06.22-loot-slice)"
        required: true
        type: string
      godot_ref:
        description: "git ref of v-sekai-multiplayer-fabric/godot (default: justfile pin)"
        required: false
        default: ""
        type: string
      include_android:
        description: "Also build + attach the Android double template (gradle; best-effort)"
        required: false
        default: true
        type: boolean

concurrency:
  group: "release-${{ github.event.inputs.tag }}"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install build dependencies
        run: just install_packages
      - name: Fetch godot source
        run: |
          REF="${{ github.event.inputs.godot_ref }}"
          if [ -n "$REF" ]; then just fetch-godot "$REF"; else just fetch-godot; fi
      - name: Build Linux editor + templates (double)
        run: |
          just build-platform-target linuxbsd editor
          just build-platform-templates linuxbsd
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            editors
            tpz
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install build dependencies
        run: just install_packages
      - name: Fetch llvm-mingw toolchain
        run: just fetch-llvm-mingw
      - name: Fetch godot source
        run: |
          REF="${{ github.event.inputs.godot_ref }}"
          if [ -n "$REF" ]; then just fetch-godot "$REF"; else just fetch-godot; fi
      - name: Set up D3D12 SDK
        run: just setup-d3d12
      - name: Build Windows editor + templates (double)
        run: |
          just build-platform-target windows editor
          just build-platform-templates windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            editors
            tpz
          if-no-files-found: error
          retention-days: 7

  android:
    if: ${{ inputs.include_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install build dependencies
        run: just install_packages
      - name: Fetch OpenJDK
        run: just fetch-openjdk
      - name: Set up Android SDK + NDK
        run: just setup-android-sdk
      - name: Fetch godot source
        run: |
          REF="${{ github.event.inputs.godot_ref }}"
          if [ -n "$REF" ]; then just fetch-godot "$REF"; else just fetch-godot; fi
      - name: Build Android templates (double, arm64 then x86_64)
        run: |
          just build-platform-target android template_debug arm64
          just build-platform-target android template_debug x86_64
          just build-platform-target android template_release arm64
          just build-platform-target android template_release x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            tpz
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: [linux, windows, android]
    # Gate the release only on the platforms the consumers strictly need
    # (Linux for the loop-slice export, Windows for the MSIX leg). Android
    # is best-effort and never blocks the release.
    if: ${{ always() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Collect release assets under consumer-expected names
        run: |
          set -euo pipefail
          mkdir -p dist
          # Linux: raw binary names already match the consumers.
          cp "assets/linux/editors/godot.linuxbsd.editor.double.x86_64"           dist/
          cp "assets/linux/tpz/godot.linuxbsd.template_release.double.x86_64"      dist/
          cp "assets/linux/tpz/godot.linuxbsd.template_debug.double.x86_64"        dist/ || true
          # Windows: strip the llvm-mingw ".llvm" infix to match the consumers'
          # godot.windows.*.double.x86_64.exe asset names.
          shopt -s nullglob
          for f in assets/windows/editors/godot.windows.editor.double.x86_64*.exe \
                   assets/windows/tpz/godot.windows.template_release.double.x86_64*.exe \
                   assets/windows/tpz/godot.windows.template_debug.double.x86_64*.exe; do
            base="$(basename "$f")"; base="${base/.llvm/}"
            cp "$f" "dist/$base"
          done
          # Android (best-effort): only present if that job succeeded.
          for f in assets/android/tpz/android_release.apk assets/android/tpz/android_debug.apk; do
            [ -e "$f" ] && cp "$f" dist/ || true
          done
          # Drop debug-symbol sidecars / static libs so the release stays lean.
          rm -f dist/*.debugsymbols dist/*.a dist/*.so 2>/dev/null || true
          echo "=== release assets ==="; ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.event.inputs.tag }}" \
            -R "${{ github.repository }}" \
            --title "${{ github.event.inputs.tag }}" \
            --notes "Merged double-precision editor + export templates (engine ref: ${{ github.event.inputs.godot_ref || 'justfile pin' }}). Assets consumed by fabric-godot-packaging (release-apk.yml / release-msix.yml) and the loop-slice Linux export." \
            dist/*
