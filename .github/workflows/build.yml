name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      godot_ref:
        description: "git ref of v-sekai-multiplayer-fabric/godot (default: justfile pin)"
        required: false
        default: ""
        type: string
      tag:
        description: "Release tag to create (default: godot ref)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 2 * * 1"
  repository_dispatch:
    types: [engine-updated]

concurrency:
  group: "build-${{ github.ref }}-${{ github.event.inputs.godot_ref || github.event.client_payload.godot_ref || 'pinned' }}"
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: editor
            image: ghcr.io/v-sekai-multiplayer-fabric/godot-editor-double
            target: editor
            binary: godot.linuxbsd.editor.double.x86_64
          - name: runtime
            image: ghcr.io/v-sekai-multiplayer-fabric/zone-godot-runtime
            target: template_release
            binary: godot.linuxbsd.template_release.double.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Fetch godot source
        run: |
          REF="${{ github.event.inputs.godot_ref || github.event.client_payload.godot_ref }}"
          if [ -n "${REF}" ]; then just fetch-godot "${REF}"; else just fetch-godot; fi
      - name: Resolve engine SHA
        id: sha
        run: echo "sha=$(git -C godot rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push image (podman)
        run: |
          podman build \
            --build-arg TARGET="${{ matrix.target }}" \
            --build-arg BINARY_NAME="${{ matrix.binary }}" \
            --build-arg SCCACHE_GHA_ENABLED=true \
            --secret id=ACTIONS_CACHE_URL,env=ACTIONS_CACHE_URL \
            --secret id=ACTIONS_RUNTIME_TOKEN,env=ACTIONS_RUNTIME_TOKEN \
            --build-context "godot-src=${{ github.workspace }}/godot" \
            --file Containerfile \
            --tag "${{ matrix.image }}:latest" \
            --tag "${{ matrix.image }}:${{ steps.sha.outputs.sha }}" \
            .
          podman push "${{ matrix.image }}:latest"
          podman push "${{ matrix.image }}:${{ steps.sha.outputs.sha }}"

  build-linux:
    # TEMPORARILY DISABLED — native Linux builds are paused. Re-enable by
    # removing this `if: false` and restoring `build-linux` to the `release`
    # job's `needs:` list below.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: linux-editor
            target: editor
          - name: linux-template-release
            target: template_release
          - name: linux-template-debug
            target: template_debug
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install build dependencies
        run: just install_packages
      - name: Fetch godot source
        run: |
          REF="${{ github.event.inputs.godot_ref || github.event.client_payload.godot_ref }}"
          if [ -n "${REF}" ]; then just fetch-godot "${REF}"; else just fetch-godot; fi
      - name: Resolve engine SHA
        id: sha
        run: echo "sha=$(git -C godot rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: just build-platform-target linuxbsd ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.name }}-${{ steps.sha.outputs.sha }}"
          path: |
            editors/
            tpz/
          if-no-files-found: warn
          retention-days: 30
      - name: Package debug symbols
        run: just package-debug-symbols debug-symbols
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.name }}-debug-symbols-${{ steps.sha.outputs.sha }}"
          path: debug-symbols/
          if-no-files-found: warn
          retention-days: 90

  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: windows-editor
            target: editor
          - name: windows-template-release
            target: template_release
          - name: windows-template-debug
            target: template_debug
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install build dependencies
        run: just install_packages
      - name: Fetch llvm-mingw toolchain
        run: just fetch-llvm-mingw
      - name: Fetch godot source
        run: |
          REF="${{ github.event.inputs.godot_ref || github.event.client_payload.godot_ref }}"
          if [ -n "${REF}" ]; then just fetch-godot "${REF}"; else just fetch-godot; fi
      - name: Set up D3D12 SDK
        run: just setup-d3d12
      - name: Resolve engine SHA
        id: sha
        run: echo "sha=$(git -C godot rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: just build-platform-target windows ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.name }}-${{ steps.sha.outputs.sha }}"
          path: |
            editors/
            tpz/
          if-no-files-found: warn
          retention-days: 30
      - name: Package debug symbols
        run: just package-debug-symbols debug-symbols
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.name }}-debug-symbols-${{ steps.sha.outputs.sha }}"
          path: debug-symbols/
          if-no-files-found: warn
          retention-days: 90

  release:
    # build-linux temporarily disabled — Windows-only release for now.
    needs: [build-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Resolve godot ref and release tag
        id: ref
        run: |
          REF="${{ github.event.inputs.godot_ref || github.event.client_payload.godot_ref }}"
          if [ -z "${REF}" ]; then
            REF=$(grep 'GODOT_PINNED_REF :=' justfile | grep -o '"[^"]*"' | tr -d '"')
          fi
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "${TAG}" ]; then TAG="${REF}"; fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Tag this commit for the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.ref.outputs.tag }}"
          git push origin "${{ steps.ref.outputs.tag }}" --force
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
      - name: Zip artifacts by platform (skip debug-symbols)
        run: |
          cd release-assets
          for dir in */; do
            name="${dir%/}"
            [[ "$name" == *-debug-symbols-* ]] && continue
            zipname=$(echo "$name" | sed 's/-[0-9a-f]*$//')
            zip -r "../${zipname}.zip" "${dir}"
          done
          cd ..
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.ref.outputs.tag }}"
          name: "Godot ${{ steps.ref.outputs.tag }}"
          body: |
            Multiplayer-fabric Godot builds for engine tag `${{ steps.ref.outputs.ref }}`.

            | Platform | Artifacts |
            |----------|-----------|
            | Windows x86_64 | `windows-editor.zip`, `windows-template-release.zip`, `windows-template-debug.zip` |

            Docker images (Linux server):
            - `ghcr.io/v-sekai-multiplayer-fabric/godot-editor-double:latest`
            - `ghcr.io/v-sekai-multiplayer-fabric/zone-godot-runtime:latest`
          files: "*.zip"
          fail_on_unmatched_files: false
          make_latest: true
