name: build

on:
  workflow_dispatch:
    inputs:
      godot_ref:
        description: "git ref of v-sekai-multiplayer-fabric/godot (default: justfile pin)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 2 * * 1"
  repository_dispatch:
    types: [engine-updated]

concurrency:
  group: "build-${{ github.ref }}-${{ github.event.inputs.godot_ref || github.event.client_payload.godot_ref || 'pinned' }}"
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: editor
            recipe: build-docker-editor
            image: ghcr.io/v-sekai-multiplayer-fabric/godot-editor-double
          - name: runtime
            recipe: build-docker-runtime
            image: ghcr.io/v-sekai-multiplayer-fabric/zone-godot-runtime
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Set up just
        uses: extractions/setup-just@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Fetch godot source
        run: |
          REF="${{ github.event.inputs.godot_ref || github.event.client_payload.godot_ref }}"
          if [ -n "${REF}" ]; then just fetch-godot "${REF}"; else just fetch-godot; fi
      - name: Resolve engine SHA
        id: sha
        run: echo "sha=$(git -C godot rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build image via just
        run: "just ${{ matrix.recipe }} latest"
      - name: Tag with engine SHA
        run: |
          docker tag "${{ matrix.image }}:latest" "${{ matrix.image }}:${{ steps.sha.outputs.sha }}"
      - name: Push image
        run: |
          docker push "${{ matrix.image }}:latest"
          docker push "${{ matrix.image }}:${{ steps.sha.outputs.sha }}"

  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-editor
            target: editor
          - name: windows-template-release
            target: template_release
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Set up just
        uses: extractions/setup-just@v3
      - name: Install build dependencies
        run: just install_packages
      - name: Fetch llvm-mingw toolchain
        run: just fetch-llvm-mingw
      - name: Fetch godot source
        run: |
          REF="${{ github.event.inputs.godot_ref || github.event.client_payload.godot_ref }}"
          if [ -n "${REF}" ]; then just fetch-godot "${REF}"; else just fetch-godot; fi
      - name: Set up D3D12 SDK
        run: just setup-d3d12
      - name: Resolve engine SHA
        id: sha
        run: echo "sha=$(git -C godot rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: "just build-platform-target windows ${{ matrix.target }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.name }}-${{ steps.sha.outputs.sha }}"
          path: |
            editors/
            tpz/
          if-no-files-found: warn
          retention-days: 30
