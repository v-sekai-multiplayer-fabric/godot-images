name: build

# Build the ghcr.io editor + runtime images on demand, sharing sccache
# storage with developer machines via a Tigris S3 bucket
# (provisioned with `fly storage create --name godot-images-sccache`).
# Secrets are set on this repo — see docs/DEVELOPMENT.md for the local
# equivalent (`source ~/.sccache-tigris.env`).
#
# Triggers (mirrors the local-first ethos — manual + scheduled only, so
# the engine compile doesn't fire on doc tweaks):
#   - workflow_dispatch (manual; can override the pinned godot tag)
#   - schedule, weekly Monday 02:00 UTC (catches engine drift)
#   - repository_dispatch event `engine-updated` from the engine repo

on:
  workflow_dispatch:
    inputs:
      godot_ref:
        description: "git ref of v-sekai-multiplayer-fabric/godot (default: justfile pin)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 2 * * 1"
  repository_dispatch:
    types: [engine-updated]

concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.godot_ref || github.event.client_payload.godot_ref || 'pinned' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: editor
            recipe: build-docker-editor
            image: ghcr.io/v-sekai-multiplayer-fabric/godot-editor-double
          - name: runtime
            recipe: build-docker-runtime
            image: ghcr.io/v-sekai-multiplayer-fabric/zone-godot-runtime

    env:
      # Mirror the env that ~/.sccache-tigris.env sets locally. With these
      # exported, the justfile's _sccache_buildargs expression forwards
      # them into `docker buildx build --build-arg ...` so the in-Docker
      # sccache compiles against the shared Tigris bucket.
      SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch godot source
        run: |
          REF="${{ github.event.inputs.godot_ref || github.event.client_payload.godot_ref }}"
          if [ -n "${REF}" ]; then
            just fetch-godot "${REF}"
          else
            just fetch-godot
          fi

      - name: Resolve engine SHA
        id: sha
        run: echo "sha=$(git -C godot rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image via just
        run: just ${{ matrix.recipe }} latest

      - name: Tag with engine SHA
        run: |
          docker tag "${{ matrix.image }}:latest" "${{ matrix.image }}:${{ steps.sha.outputs.sha }}"

      - name: Push image
        run: |
          docker push "${{ matrix.image }}:latest"
          docker push "${{ matrix.image }}:${{ steps.sha.outputs.sha }}"
